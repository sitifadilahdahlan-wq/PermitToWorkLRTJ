<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-PTW LRT Jakarta - Real-Time Dashboard & Document Center</title>
  
  <!-- Tailwind CSS -->

  <style>
    body, button, input, select, textarea, table {
      font-family: 'Century Schoolbook', 'Schola', 'TeX Gyre Schola', Georgia, 'Times New Roman', serif !important;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .custom-leaflet-icon-wrapper {
      display: flex !important;

      justify-content: center !important;
      width: 24px !important;
      height: 24px !important;
      background: transparent !important;
      border: none !important;

    @keyframes yellow-sonar {
      0% {
        transform: scale(0.9) translateZ(0);
        opacity: 1;
        box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.8);
      }
      70% {
        transform: scale(1.3) translateZ(0);

      }
      100% {
        transform: scale(0.9) translateZ(0);
        opacity: 1;
        box-shadow: 0 0 0 0 rgba(234, 179, 8, 0);
      }
    }
    
    .marker-active-radar {
      width: 18px;
      height: 18px;
      background-color: #eab308;
      border: 3px solid #ffffff;
      border-radius: 50%;
      display: block;
      will-change: transform, box-shadow, opacity;
      transform: transform-gpu;
      animation: yellow-sonar 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
      box-shadow: 0 2px 10px rgba(234,179,8,0.5);
    }

    .marker-standby-green {
      width: 18px;
      height: 18px;
      background-color: #22c55e;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(34,197,94,0.4);
      display: block;
    }

    .marker-inactive-solid {
      width: 14px;
      height: 14px;
      background-color: #64748b;
      border: 2px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      display: block;
    }

    @keyframes blue-sonar {
      0% {
        transform: scale(0.9) translateZ(0);
        opacity: 1;
        box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.8);
      }
      70% {
        transform: scale(1.4) translateZ(0);
        opacity: 0.3;
        box-shadow: 0 0 0 16px rgba(59, 130, 246, 0);
      }
      100% {
        transform: scale(0.9) translateZ(0);
        opacity: 1;
        box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
      }
    }
    .marker-user-satpam {
      width: 22px;
      height: 22px;
      background-color: #3b82f6;
      border: 3px solid #ffffff;
      border-radius: 50%;
      display: block;
      will-change: transform, box-shadow, opacity;
      transform: transform-gpu;
      animation: blue-sonar 1.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
      box-shadow: 0 3px 12px rgba(59, 130, 246, 0.6);
    }

    @keyframes indigo-sonar {
      0% {
        transform: scale(0.9) translateZ(0);
        opacity: 1;
        box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.8);
      }
      70% {
        transform: scale(1.4) translateZ(0);
        opacity: 0.3;
        box-shadow: 0 0 0 16px rgba(99, 102, 241, 0);
      }
      100% {
        transform: scale(0.9) translateZ(0);
        opacity: 1;
        box-shadow: 0 0 0 0 rgba(99, 102, 241, 0);
      }
    }
    .marker-user-karyawan {
      width: 22px;
      height: 22px;
      background-color: #6366f1;
      border: 3px solid #ffffff;
      border-radius: 50%;
      display: block;
      will-change: transform, box-shadow, opacity;
      transform: transform-gpu;
      animation: indigo-sonar 1.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
      box-shadow: 0 3px 12px rgba(99, 102, 241, 0.6);
    }

    .alert-danger-glow {
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.85);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 10px;
    }

    @media print {
      body {
        background: white !important;
        color: black !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-serif antialiased selection:bg-red-200">

  <div id="root"></div>

  <script type="text/babel">
  const { useState, useEffect, useRef, useMemo } = React;

  // LOKASI JALUR UTAMA STASIUN LRT JAKARTA
  const FALLBACK_STASIUN = [
    { id: "Depo MCC", nama: "Depo MCC LRT Jakarta", lat: -6.156795339551294, lng: 106.91528786709415 },
    { id: "Stasiun Pegangsaan Dua", nama: "Stasiun Pegangsaan Dua", lat: -6.157070676038542, lng: 106.91449309425593 },
    { id: "Stasiun Boulevard Utara", nama: "Stasiun Boulevard Utara", lat: -6.159105955709021, lng: 106.90616182650807 },
    { id: "Stasiun Boulevard Selatan", nama: "Stasiun Boulevard Selatan", lat: -6.168766492876034, lng: 106.90002738233045 },
    { id: "Stasiun Pulomas", nama: "Stasiun Pulomas", lat: -6.1770879960090115, lng: 106.89335780931744 },
    { id: "Stasiun Equestrian", nama: "Stasiun Equestrian", lat: -6.183487331912757, lng: 106.89130072465954 },
    { id: "Stasiun Velodrome", nama: "Stasiun Velodrome", lat: -6.192283299084887, lng: 106.89117438312587 }
  ];

  const JALUR_SIMULASI_PATROLI = [
    [-6.156795, 106.915287], // Depo MCC
    [-6.157000, 106.914800],
    [-6.157070, 106.914493], // Stasiun Pegangsaan Dua
    [-6.157800, 106.911000],
    [-6.158500, 106.908500],
    [-6.159105, 106.906161], // Stasiun Boulevard Utara
    [-6.162000, 106.904000],
    [-6.165000, 106.902000],
    [-6.168766, 106.900027], // Stasiun Boulevard Selatan
    [-6.172000, 106.897000],
    [-6.175000, 106.895000],
    [-6.177087, 106.893357], // Stasiun Pulomas
    [-6.180000, 106.892200],
    [-6.183487, 106.891300], // Stasiun Equestrian
    [-6.188000, 106.891200],
    [-6.192283, 106.891174]  // Stasiun Velodrome
  ];

  const parseCoordinate = (val) => {
    if (val === undefined || val === null || val === "") return NaN;
    const cleanStr = String(val).replace(/,/g, '.').replace(/\s/g, '');
    return parseFloat(cleanStr);
  };

  // Parse status permit terstruktur dari server
  const parseServerPtwStatus = (statusStr) => {
    const defaultState = { baseStatus: "Pending", verified: [], completed: [] };
    if (!statusStr) return defaultState;

    const parts = String(statusStr).split(" | ");
    const baseStatus = parts[0] || "Pending";
    let verified = [];
    let completed = [];

    parts.forEach(part => {
      if (part.startsWith("Verified: ")) {
        verified = part.replace("Verified: ", "").split(",").map(s => s.trim()).filter(Boolean);
      } else if (part.startsWith("Completed: ")) {
        completed = part.replace("Completed: ", "").split(",").map(s => s.trim()).filter(Boolean);
      }
    });

    return { baseStatus, verified, completed };
  };

  const getDeterministicNo = (id, prefix = "PTW") => {
    if (!id) return `${prefix}/LRTJ/101/${new Date().getFullYear()}`;
    const num = String(id).replace(/\D/g, "");
    const suffix = num ? num.slice(-3) : "101";
    const year = new Date().getFullYear();
    return `${prefix}/LRTJ/${suffix}/${year}`;
  };

  const formatDateOnly = (val) => {
    if (!val) return "";
    return String(val).split(/[ T]/)[0];
  };

  function App() {
    const isGas = typeof google !== 'undefined' && google !== null && google.script && google.script.run;

    const [isLoggedIn, setIsLoggedIn] = useState(false);
    const [role, setRole] = useState("satpam"); 
    const [currentUser, setCurrentUser] = useState(null);
    const [loginEmail, setLoginEmail] = useState("");
    const [loginPassword, setLoginPassword] = useState("");
    const [loginError, setLoginError] = useState("");
    const [isLoggingIn, setIsLoggingIn] = useState(false);
    const [isLoggingOut, setIsLoggingOut] = useState(false);
    
    const [muted, setMuted] = useState(false);
    const [showNotifCenter, setShowNotifCenter] = useState(false);
    const [realTimeClock, setRealTimeClock] = useState(new Date());

    const [ptwDB, setPtwDB] = useState([]);
    const [satpamList, setSatpamList] = useState([]);
    const [karyawanList, setKaryawanList] = useState([]);
    
    const [listLokasiTugas, setListLokasiTugas] = useState(FALLBACK_STASIUN);
    const [currentTab, setCurrentTab] = useState("dashboard"); 

    const [searchQuery, setSearchQuery] = useState("");
    const [statusFilter, setStatusFilter] = useState("Semua"); 

    const [userCoords, setUserCoords] = useState(null);
    const [gpsAccuracy, setGpsAccuracy] = useState(null);
    const [gpsSpeed, setGpsSpeed] = useState(null);
    const [lockCamera, setLockCamera] = useState(true);

    const [isSimulating, setIsSimulating] = useState(false);
    const simulatedIndexRef = useRef(0);
    const simulationIntervalRef = useRef(null);

    const hasCenteredOnUserRef = useRef(false);
    
    const [isCreateModalOpen, setIsCreateModalOpen] = useState(false);
    const [notificationMsg, setNotificationMsg] = useState("");
    const [actionQueue, setActionQueue] = useState([]);
    const [showActionPopup, setShowActionPopup] = useState(false);
    const [previewPdfPtw, setPreviewPdfPtw] = useState(null); 

    const [selectedChartLocation, setSelectedChartLocation] = useState(null);

    const [isMapFullscreen, setIsMapFullscreen] = useState(false);
    const [acknowledgedExpiredIds, setAcknowledgedExpiredIds] = useState(() => {
      try {
        const saved = localStorage.getItem("acknowledged_expired_ptws");
        return saved ? JSON.parse(saved) : [];
      } catch (e) {
        return [];
      }
    });

    const [formPtwNo, setFormPtwNo] = useState("");
    const [formJsaNo, setFormJsaNo] = useState("");
    const [formVendor, setFormVendor] = useState("");
    const [formPenanggungJawab, setFormPenanggungJawab] = useState("");
    const [formShePelaksana, setFormShePelaksana] = useState("");
    const [formPemberiKerja, setFormPemberiKerja] = useState("");
    const [formPengawasPemberiKerja, setFormPengawasPemberiKerja] = useState("");
    
    const [formPekerjaan, setFormPekerjaan] = useState("");
    const [formLokasi, setFormLokasi] = useState([]);
    const [formTglMulai, setFormTglMulai] = useState("");
    const [formJamMulai, setFormJamMulai] = useState("");
    const [formTglSelesai, setFormTglSelesai] = useState("");
    const [formJamSelesai, setFormJamSelesai] = useState("");
    const [formPekerjaCount, setFormPekerjaCount] = useState(2);
    const [formPersonelList, setFormPersonelList] = useState("");

    const [formPotensiApi, setFormPotensiApi] = useState("Tidak"); 
    const [formApdList, setFormApdList] = useState({
      "Safety Helmet": true, "Safety Vest": true, "Safety Shoes": true, "Ear Muff": false,
      "Ear Plug": false, "Hair Protection": false, "Face Protector": false, "Welding Mask": false,
      "Apron": false, "Welding Clothes": false, "Protective Clothing": false, "Leather Gloves": false,
      "Gas Mask": false, "Dust Mask": false, "Breathing Apparatus": false, "Nitrile Gloves": false,
      "Cotton Gloves": false, "Full Body Harness": false, "Goggles": false, "Safety Glasses": false,
      "Lain-lain": ""
    });

    const [formIsolasiBahanKimia, setFormIsolasiBahanKimia] = useState("Tidak");
    const [formIsolasiMsds, setFormIsolasiMsds] = useState("Tidak");

    const [formLotoProsedur, setFormLotoProsedur] = useState("Tidak");
    const [formLotoListrik, setFormLotoListrik] = useState("Tidak");
    const [formLotoMekanis, setFormLotoMekanis] = useState("Tidak");
    const [formLotoHidrolik, setFormLotoHidrolik] = useState("Tidak");

    const mapRef = useRef(null);
    const markersLayerRef = useRef(null);
    const userAccuracyCircleRef = useRef(null);
    
    const chartPekerjaRef = useRef(null);
    const chartStatusRef = useRef(null);
    const activeChartPekerjaInstance = useRef(null);
    const activeChartStatusInstance = useRef(null);
    
    const gpsWatchIdRef = useRef(null);

    const prevQueueLengthRef = useRef(0);
    const prevExpiredLengthRef = useRef(0);

    const playNotificationSound = (type) => {
      if (muted) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();

        if (type === 'new-task') {
          const osc1 = ctx.createOscillator();
          const gain = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(523.25, ctx.currentTime); 
          osc1.frequency.setValueAtTime(659.25, ctx.currentTime + 0.12); 
          
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
          
          osc1.connect(gain);
          gain.connect(ctx.destination);
          osc1.start();
          osc1.stop(ctx.currentTime + 0.35);
        } else if (type === 'danger') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.linearRampToValueAtTime(880, ctx.currentTime + 0.15);
          osc.frequency.linearRampToValueAtTime(440, ctx.currentTime + 0.3);
          
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        } else if (type === 'success') {
          const notes = [523.25, 659.25, 783.99, 1046.50];
          notes.forEach((freq, index) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + (index * 0.08));
            
            gain.gain.setValueAtTime(0.08, ctx.currentTime + (index * 0.08));
            gain.gain.exponentialRampToValueAtTime(0.005, ctx.currentTime + (index * 0.08) + 0.2);
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + (index * 0.08));
            osc.stop(ctx.currentTime + (index * 0.08) + 0.2);
          });
        }
      } catch (e) {
        console.warn("Pemberitahuan suara tidak didukung:", e);
      }
    };

    // Tracking GPS
    useEffect(() => {
      if (!isLoggedIn || !currentUser) {
        setUserCoords(null);
        setGpsAccuracy(null);
        setGpsSpeed(null);
        hasCenteredOnUserRef.current = false;
        if (gpsWatchIdRef.current !== null && navigator.geolocation) {
          navigator.geolocation.clearWatch(gpsWatchIdRef.current);
          gpsWatchIdRef.current = null;
        }
        return;
      }

      if (isSimulating) return;

      if (navigator.geolocation) {
        showToast("Menghubungkan GPS Sektor...");
        gpsWatchIdRef.current = navigator.geolocation.watchPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            const speed = position.coords.speed;

            setUserCoords({ lat, lng });
            setGpsAccuracy(Math.round(accuracy));
            setGpsSpeed(speed ? Math.round(speed * 3.6) : 0);

            if (mapRef.current && lockCamera) {
              mapRef.current.setView([lat, lng], 15);
              hasCenteredOnUserRef.current = true;
            }

            if (isGas) {
              const resolvedRoleName = role === "satpam" ? "Satpam" : "Karyawan";
              google.script.run
                .withSuccessHandler((res) => {
                  if (res && !res.success) {
                    console.warn("Sinkronisasi lokasi gagal:", res.error);
                  }
                })
                .withFailureHandler((err) => console.error("Koneksi GPS gagal:", err))
                .updateUserLocation(currentUser.Email, resolvedRoleName, lat, lng);
            }
          },
          (error) => {
            console.warn("Gagal membaca GPS Akurat:", error);
            showToast("Akurasi rendah atau izin GPS ditolak. Gunakan tombol 'Simulasi'!");
          },
          { 
            enableHighAccuracy: true,
            timeout: 7000, 
            maximumAge: 0 
          }
        );
      } else {
        showToast("Peramban tidak mendukung sensor GPS internal!");
      }

      return () => {
        if (gpsWatchIdRef.current !== null && navigator.geolocation) {
          navigator.geolocation.clearWatch(gpsWatchIdRef.current);
          gpsWatchIdRef.current = null;
        }
      };
    }, [isLoggedIn, currentUser, isSimulating, lockCamera]);

    // Simulator Patroli
    const toggleSimulation = () => {
      if (isSimulating) {
        clearInterval(simulationIntervalRef.current);
        simulationIntervalRef.current = null;
        setIsSimulating(false);
        setGpsSpeed(0);
        setGpsAccuracy(null);
        showToast("Simulasi berjalan dihentikan.");
      } else {
        if (gpsWatchIdRef.current !== null && navigator.geolocation) {
          navigator.geolocation.clearWatch(gpsWatchIdRef.current);
          gpsWatchIdRef.current = null;
        }

        setIsSimulating(true);
        simulatedIndexRef.current = 0;
        setGpsAccuracy(3);
        setGpsSpeed(5);
        showToast("Simulasi Patroli Jalur Rel Dimulai!");

        const startNextStep = () => {
          const coords = JALUR_SIMULASI_PATROLI[simulatedIndexRef.current];
          if (!coords) return;
          const lat = coords[0];
          const lng = coords[1];

          setUserCoords({ lat, lng });

          if (mapRef.current && lockCamera) {
            mapRef.current.setView([lat, lng], 15);
          }

          if (isGas && currentUser) {
            const resolvedRoleName = role === "satpam" ? "Satpam" : "Karyawan";
            google.script.run.updateUserLocation(currentUser.Email, resolvedRoleName, lat, lng);
          }

          simulatedIndexRef.current = (simulatedIndexRef.current + 1) % JALUR_SIMULASI_PATROLI.length;
        };

        startNextStep();
        simulationIntervalRef.current = setInterval(startNextStep, 4000);
      }
    };

    useEffect(() => {
      return () => {
        if (simulationIntervalRef.current) {
          clearInterval(simulationIntervalRef.current);
        }
      };
    }, []);

    const getStationStatusForPtw = (ptw, stasiunId) => {
      const normalizedStasiun = String(stasiunId).toLowerCase().trim();
      const parsed = parseServerPtwStatus(ptw.status);
      
      if (parsed.baseStatus === "Expired") return "Expired";
      if (parsed.baseStatus === "Pending") return "Pending";

      const isCompleted = parsed.completed.some(loc => String(loc || "").toLowerCase().trim() === normalizedStasiun);
      if (isCompleted) return "Expired"; 

      const isVerified = parsed.verified.some(loc => String(loc || "").toLowerCase().trim() === normalizedStasiun);
      if (isVerified) return "Work In Progress"; 

      if (parsed.baseStatus === "Work In Progress" || parsed.baseStatus === "Awaiting Satpam Verification" || parsed.baseStatus === "Approved") {
        return "Awaiting Satpam Verification"; 
      }

      return parsed.baseStatus; 
    };

    const getPtwStatusForUser = (ptw) => {
      const now = new Date();
      const cleanExpireDate = formatDateOnly(ptw.tanggalSelesai);
      const expireDateStr = `${cleanExpireDate}T${ptw.jamSelesai || "23:59"}:00`;
      const endDateTime = new Date(expireDateStr);
      
      const parsed = parseServerPtwStatus(ptw.status);
      const baseStatus = parsed.baseStatus;

      if (now > endDateTime || baseStatus === "Expired") {
        return "Expired";
      }

      if (baseStatus === "Work In Progress" || baseStatus === "Awaiting Satpam Verification" || baseStatus === "Approved") {
        return "Permit Aktif";
      }

      return baseStatus;
    };

    // Alur Kerja & Notifikasi Tindakan Segera
    useEffect(() => {
      if (!isLoggedIn || !currentUser) {
        setActionQueue([]);
        setShowActionPopup(false);
        return;
      }

      let pendingList = [];
      if (role === "satpam") {
        const myLoc = (currentUser["Lokasi Tugas"] || "").toLowerCase().trim();
        pendingList = ptwDB.filter(ptw => {
          const parsed = parseServerPtwStatus(ptw.status);
          const locationsList = ptw.lokasi || [];
          const isTargetLoc = locationsList.some(loc => String(loc || "").toLowerCase().trim() === myLoc);
          const isAlreadyVerified = parsed.verified.some(loc => String(loc || "").toLowerCase().trim() === myLoc);
          const isAlreadyCompleted = parsed.completed.some(loc => String(loc || "").toLowerCase().trim() === myLoc);
          
          const needsVerify = (parsed.baseStatus === "Awaiting Satpam Verification" || parsed.baseStatus === "Work In Progress" || parsed.baseStatus === "Approved") 
            && !isAlreadyVerified && !isAlreadyCompleted;
          return isTargetLoc && needsVerify;
        });
      } else if (role === "karyawan") {
        pendingList = ptwDB.filter(ptw => {
          const parsed = parseServerPtwStatus(ptw.status);
          return parsed.baseStatus === "Pending";
        });
      }

      setActionQueue(pendingList);
      setShowActionPopup(pendingList.length > 0);

      if (pendingList.length > prevQueueLengthRef.current) {
        playNotificationSound('new-task');
      }
      prevQueueLengthRef.current = pendingList.length;

    }, [ptwDB, currentUser, role, isLoggedIn]);

    const unacknowledgedExpiredPermits = useMemo(() => {
      if (!isLoggedIn) return [];
      return ptwDB.filter(ptw => {
        const resolvedStatus = getPtwStatusForUser(ptw);
        return resolvedStatus === "Expired" && !acknowledgedExpiredIds.includes(ptw.id);
      });

    function verifyPTWSector(idPtw, sectorName, verifierName) {
      const ss = SpreadsheetApp.openById(SPREADSHEET_ID);
      initDatabaseIfNeeded(ss);
      
      const ptwSheet = ss.getSheetByName("Histori Data PTW");
      if (!ptwSheet) throw new Error("Helaian Histori Data PTW tidak dijumpai.");
      
      const ptwData = ptwSheet.getDataRange().getValues();
      let foundRow = -1;
      let currentStatus = "";
      let ptwDetails = {};
      
      // PROTEKSI KOLOM R (18): Menemukan secara dinamis indeks kolom "Masa Berlaku"
      const statusCol = getColIndexByHeaderName(ptwSheet, "Masa Berlaku");
      const targetCol = statusCol !== -1 ? statusCol : 18;
      
      for (let i = 1; i < ptwData.length; i++) {
        if (ptwData[i][0] === idPtw) {
          foundRow = i + 1;
          currentStatus = String(ptwData[i][targetCol - 1] || "Pending");
          ptwDetails = {
            perusahaan: ptwData[i][7],
            jenis: ptwData[i][11],
            lokasi: ptwData[i][12]
          };
          break;
        }
      }
      
      if (foundRow === -1) throw new Error("Nomor dokumen PTW ID " + idPtw + " tidak dijumpai.");
      
      let baseStatus = "Work In Progress";
      let verifiedStations = [];
      let completedStations = [];
      
      const parts = currentStatus.split(" | ");
      parts.forEach(part => {
        if (part.startsWith("Verified: ")) {
          verifiedStations = part.replace("Verified: ", "").split(",").map(s => s.trim()).filter(Boolean);
        } else if (part.startsWith("Completed: ")) {
          completedStations = part.replace("Completed: ", "").split(",").map(s => s.trim()).filter(Boolean);
        }
      });
      
      const cleanSector = String(sectorName).trim();
      if (verifiedStations.indexOf(cleanSector) === -1) {
        verifiedStations.push(cleanSector);
      }
      
      let newStatus = baseStatus;
      if (verifiedStations.length > 0) newStatus += " | Verified: " + verifiedStations.join(", ");
      if (completedStations.length > 0) newStatus += " | Completed: " + completedStations.join(", ");
      
      ptwSheet.getRange(foundRow, targetCol).setValue(newStatus);
      
      const vendorSheet = ss.getSheetByName("Histori Pekerjaan Vendor");
      if (vendorSheet) {
        vendorSheet.appendRow([
          idPtw,
          ptwDetails.perusahaan || "-",
          ptwDetails.jenis || "-",
          ptwDetails.lokasi || "-",
          verifierName + " (Satpam)",
          "-",
          "Pekerjaan Dimulai - Fisik Vendor Diverifikasi di Sektor: " + cleanSector,
          new Date()
        ]);
      }
      
      return { success: true, updatedStatus: newStatus };
    }

    function completePTWSector(idPtw, sectorName, completerName) {
      const ss = SpreadsheetApp.openById(SPREADSHEET_ID);
      initDatabaseIfNeeded(ss);
      
      const ptwSheet = ss.getSheetByName("Histori Data PTW");
      if (!ptwSheet) throw new Error("Helaian Histori Data PTW tidak dijumpai.");
      
      const ptwData = ptwSheet.getDataRange().getValues();
      let foundRow = -1;
      let currentStatus = "";
      let ptwDetails = {};
      
      // PROTEKSI KOLOM R (18): Menemukan secara dinamis indeks kolom "Masa Berlaku"
      const statusCol = getColIndexByHeaderName(ptwSheet, "Masa Berlaku");
      const targetCol = statusCol !== -1 ? statusCol : 18;
      
      for (let i = 1; i < ptwData.length; i++) {
        if (ptwData[i][0] === idPtw) {
          foundRow = i + 1;
          currentStatus = String(ptwData[i][targetCol - 1] || "Pending");
          ptwDetails = {
            perusahaan: ptwData[i][7],
            jenis: ptwData[i][11],
            lokasi: String(ptwData[i][12] || "").split(",").map(s => s.trim()).filter(Boolean)
          };
          break;
        }
      }
      
      if (foundRow === -1) throw new Error("Nomor dokumen PTW ID " + idPtw + " tidak dijumpai.");
      
      let baseStatus = "Work In Progress";
      let verifiedStations = [];
      let completedStations = [];
      
      const parts = currentStatus.split(" | ");
      parts.forEach(part => {
        if (part.startsWith("Verified: ")) {
          verifiedStations = part.replace("Verified: ", "").split(",").map(s => s.trim()).filter(Boolean);
        } else if (part.startsWith("Completed: ")) {
          completedStations = part.replace("Completed: ", "").split(",").map(s => s.trim()).filter(Boolean);
        }
      });
      
      const cleanSector = String(sectorName).trim();
      if (completedStations.indexOf(cleanSector) === -1) {
        completedStations.push(cleanSector);
      }
      
      const allCompleted = ptwDetails.lokasi.every(loc => 
        completedStations.some(comp => comp.toLowerCase().trim() === loc.toLowerCase().trim())
      );
      
      if (allCompleted) {
        baseStatus = "Expired"; 
      }
      
      let newStatus = baseStatus;
      if (verifiedStations.length > 0) newStatus += " | Verified: " + verifiedStations.join(", ");
      if (completedStations.length > 0) newStatus += " | Completed: " + completedStations.join(", ");
      
      ptwSheet.getRange(foundRow, targetCol).setValue(newStatus);
      
      const vendorSheet = ss.getSheetByName("Histori Pekerjaan Vendor");

          "Pekerjaan Diakhiri & Selesai di Sektor: " + cleanSector,
          new Date()
        ]);
      }
      
      return { success: true, updatedStatus: newStatus };
    }
      
    function uploadFileToDrive(base64Data, fileName, folderId) {  
      try {  
        const folder = DriveApp.getFolderById(folderId);  
        const contentType = base64Data.substring(5, base64Data.indexOf(';base64'));  
        const base64Clean = base64Data.substring(base64Data.indexOf(';base64,') + 8);  
        const data = Utilities.base64Decode(base64Clean);  
        const blob = Utilities.newBlob(data, contentType, fileName);  
        const file = folder.createFile(blob);  
        
        file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);  
        return file.getUrl();  
      } catch (e) {  
        return "Error Upload: " + e.toString();  
      }  
    }
